services:
  platform-orchestrator-iam-platform-orchestrator-iam:
    environment:
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
    volumes:
      - type: bind
        source: ./mock-emails
        target: /tmp/mock-emails
    depends_on:
      spicedb:
        condition: service_healthy

  platform-orchestrator-cp-platform-orchestrator-cp:
    environment:
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      VAULT_AUTH: token:mytoken
      DATA_PLANE_URL: http://platform-orchestrator-dp-platform-orchestrator-dp:8080
    depends_on:
      vault-init:
        condition: service_completed_successfully
  vault:
    image: hashicorp/vault:1.14
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: mytoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
  vault-init:
    image: hashicorp/vault:1.14
    environment:
      VAULT_TOKEN: mytoken
      VAULT_ADDR: http://vault:8200
    depends_on:
      vault:
        condition: service_started
    command:
      - "sh"
      - "-c"
      - "until vault secrets disable transit; do sleep 3; done; vault secrets enable transit"
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:8080
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  spicedb:
    image: authzed/spicedb:v1.45.4
    command: serve-testing
    ports:
      - "50051:50051"
      - "8443:8443"
      - "9090:9090"
    environment:
      - SPICEDB_GRPC_PRESHARED_KEY=t0k3n
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-v", "-addr=localhost:50051"]
      interval: 5s
      timeout: 3s
      retries: 3
