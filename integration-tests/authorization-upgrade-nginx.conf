events {}

http {
  server {
    listen 80;
    default_type application/json;

    location = /internal/orgs/acme {
      return 200 '{"id":"acme","uuid":"70000000-0000-4000-8000-000000000001","created_at":"2026-01-01T00:00:00Z","created_by":"ffffffff-ffff-ffff-ffff-ffffffffffff","plan":"default","source":"internal","status":"active"}';
    }

    location = /orgs/acme/projects {
      return 200 '{"items":[{"uuid":"30000000-0000-4000-8000-000000000001"}]}';
    }

    location = /internal/orgs/acme/projects/30000000-0000-4000-8000-000000000001/envs {
      return 200 '{"items":[{"uuid":"40000000-0000-4000-8000-000000000001"}]}';
    }

    location / {
      return 404 '{"error":"fixture route not found"}';
    }
  }
}
