    IAM_ALLOWED_MICROSOFT_CLIENT_IDS: none
    SESSION_TOKEN_COOKIE_DOMAIN: localhost
    TEST_USER_PROVIDER_AGE_IDENTITY: AGE-SECRET-KEY-17WXCCNPHSLMZDSUKVZQX8JE9XVCJJ6MW77L3CYGSF6U30TG9LDFQ80VQYS
    VAULT_URL: "http://vault:8200"
    UI_HOST_URL: http://localhost:30080
    SENDGRID_API_KEY: mock
    INVITATION_EMAIL_SENDER_NAME: "Platform Orchestrator"
