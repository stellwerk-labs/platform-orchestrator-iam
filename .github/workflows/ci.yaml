name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "shared/v*"
  pull_request:

permissions:
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install yq
        run: |
          sudo curl --fail --location --silent --show-error \
            https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 \
            --output /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Generate
        run: make generate

      - name: Tidy root module
        run: go mod tidy

      - name: Verify generated and module files
        run: git diff --exit-code

      - name: Unit tests
        run: make test-unit

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: cover.out

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable Docker containerd snapshotter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features": {"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Score Compose
        uses: score-spec/setup-score@v3.2.4
        with:
          file: score-compose
          version: 0.17.0

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0

      - name: Build integration environment
        run: make build

      - name: Run integration tests
        run: make test-integration

      - name: Show integration logs
        if: failure()
        run: make test-integration-logs

      - name: Clean integration environment
        if: always()
        run: make clean

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test-unit
      - test-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release
        id: release
        uses: stellwerk-labs/semantic-release-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        if: steps.release.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        if: steps.release.outputs.version != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-iam:${{ steps.release.outputs.version }}
