name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate
        run: make generate

      - name: Tidy root module
        run: go mod tidy

      - name: Verify generated and module files
        run: git diff --exit-code

      - name: Unit tests
        run: make test-unit

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.11.4

      - name: Upload unit test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-coverage
          path: cover.out

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Disable Docker containerd snapshotter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features": {"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Score Compose
        uses: score-spec/setup-score@888a7deafd396c3f3f05e00d2d9b0ab225799ac0 # v3.2.4
        with:
          file: score-compose
          version: 0.17.0

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Build integration environment
        run: make build

      - name: Run integration tests
        run: make test-integration

      - name: Show integration logs
        if: failure()
        run: make test-integration-logs

      - name: Clean integration environment
        if: always()
        run: make clean

  test-authorization-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Disable Docker containerd snapshotter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features": {"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Test SpiceDB-to-Casbin upgrade and rollback
        run: make test-authorization-upgrade

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-iam' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test-unit
      - test-integration
      - test-authorization-upgrade
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Release
        id: release
        uses: stellwerk-labs/semantic-release-action@b1269e93b486873118eef1646bfcd46a9d23d3a3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        if: steps.release.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build and publish image
        if: steps.release.outputs.version != ''
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-iam:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published image
        if: steps.release.outputs.version != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/platform-orchestrator-iam@${IMAGE_DIGEST}"
