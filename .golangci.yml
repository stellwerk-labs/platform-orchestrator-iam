# see https://golangci-lint.run/usage/configuration/
version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - goconst
    - gosec
    - sqlclosecheck
    - testifylint

  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - goconst
      # Exclude contextcheck for cmd/server as it contains service initialization and shutdown logic
      # that uses service contexts which don't need to be passed through from parent contexts.
      - path: 'cmd/server/.*\.go'
        linters:
          - contextcheck
