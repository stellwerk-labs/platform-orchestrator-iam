schemaFile: ./schema.zed

relationships: |-
  // Link scoped roles to their orgs
  scoped_role:0199bde9-7119-712c-9107-318bccfd26db#org@org:acme
  scoped_role:0199bde9-7119-7bed-b308-0736ccad2e3e#org@org:acme
  scoped_role:0199bde9-7119-7ed0-af5b-7d5d94faae4e#org@org:widgets_inc
  scoped_role:0199bde9-7119-7feb-8b9c-52c8de71be1b#org@org:widgets_inc

  // Assign users to scoped roles
  scoped_role:0199bde9-7119-712c-9107-318bccfd26db#member@user:alice
  scoped_role:0199bde9-7119-7bed-b308-0736ccad2e3e#member@user:charlie
  scoped_role:0199bde9-7119-7ed0-af5b-7d5d94faae4e#member@user:diana
  scoped_role:0199bde9-7119-7feb-8b9c-52c8de71be1b#member@user:eve

  // Link scoped roles to orgs
  org:acme#all_manager@scoped_role:0199bde9-7119-712c-9107-318bccfd26db
  org:acme#all_reader@scoped_role:0199bde9-7119-7bed-b308-0736ccad2e3e
  org:widgets_inc#all_manager@scoped_role:0199bde9-7119-7ed0-af5b-7d5d94faae4e
  org:widgets_inc#all_reader@scoped_role:0199bde9-7119-7feb-8b9c-52c8de71be1b

assertions:
  assertTrue:
  # Alice is admin, should have all permissions on acme org
  - org:acme#manage@user:alice
  - org:acme#write@user:alice
  - org:acme#read@user:alice
  
  # Charlie is a viewer, should only have read permission on acme org
  - org:acme#read@user:charlie
  # Eve is a widgets reader
  - org:widgets_inc#read@user:eve

assertFalse:
  # Charlie is viewer, should NOT have manage or write on acme org
  - org:acme#manage@user:charlie
  - org:acme#write@user:charlie
  
  # Charlie should NOT manage acme projects
  - project:acme_project_alpha#manage@user:charlie
  - project:acme_project_beta#manage@user:charlie
  
  # Eve is widgets reader, should NOT have manage or write
  - org:widgets_inc#manage@user:eve
  - org:widgets_inc#write@user:eve
  
  # Alice should NOT have any permissions on widgets_inc
  - org:widgets_inc#read@user:alice
  
  # Diana/Eve should NOT have permissions on acme
  - org:acme#read@user:diana
  - org:acme#manage@user:eve
